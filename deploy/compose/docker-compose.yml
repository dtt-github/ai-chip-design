# Wafersmith local development stack (infra only; the API and web app run on the host).
#   docker compose -f deploy/compose/docker-compose.yml up -d
name: wafersmith

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wafer
      POSTGRES_PASSWORD: wafer
      POSTGRES_DB: wafersmith
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wafer -d wafersmith"]
      interval: 2s
      timeout: 3s
      retries: 30

  rauthy:
    image: ghcr.io/sebadob/rauthy:0.37.2
    # Dev-only config: plain HTTP on localhost, embedded Hiqlite storage.
    volumes:
      - ./rauthy/config.toml:/app/config.toml:ro
      - ./rauthy/bootstrap:/app/bootstrap:ro
      - rauthy-data:/app/data
    environment:
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: "Wafersmith-admin-2026"
    ports:
      - "127.0.0.1:8180:8080"

volumes:
  pg-data:
  rauthy-data:
