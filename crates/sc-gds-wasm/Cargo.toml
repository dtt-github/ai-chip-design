[package]
name = "sc-gds-wasm"
description = "WebAssembly bindings for sc-gds (built with scripts/build-wasm.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sc-gds = { path = "../sc-gds" }
# Must match the wasm-bindgen CLI version used by scripts/build-wasm.sh.
wasm-bindgen = "=0.2.130"
