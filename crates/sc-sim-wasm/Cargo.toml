[package]
name = "sc-sim-wasm"
description = "WebAssembly bindings for sc-sim (built with scripts/build-wasm.sh)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sc-sim = { path = "../sc-sim" }
# Must match the wasm-bindgen CLI version used by scripts/build-wasm.sh.
wasm-bindgen = "=0.2.130"
